<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotina RPG</title>
  <meta name="description" content="Transforme sua rotina em um RPG: missões, XP, níveis, ouro e conquistas.">
  <meta name="theme-color" content="#16131f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rotina RPG">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #16131f;
  --bg-2: #1f1a2c;
  --card: #262035;
  --card-2: #2f2842;
  --border: #3d3454;
  --text: #ece6f7;
  --muted: #a99fc0;
  --accent: #9b7bff;
  --accent-2: #c3b0ff;
  --chart: #9372f5;
  --gold: #f2c14e;
  --hp: #e5484d;
  --hp-low: #ff6b6b;
  --xp: #4cc38a;
  --bad: #ff7a7a;
  --good: #6fdca5;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --radius: 14px;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f1e8;
    --bg-2: #ece5d6;
    --card: #fffdf8;
    --card-2: #f4eee2;
    --border: #ddd2bd;
    --text: #2a2236;
    --muted: #6e6480;
    --accent: #6c4de0;
    --accent-2: #5a3fc4;
    --chart: #6c4de0;
    --gold: #b7860b;
    --hp: #d33a3f;
    --hp-low: #e5484d;
    --xp: #2a9d68;
    --bad: #c53030;
    --good: #2a9d68;
    --shadow: 0 4px 16px rgba(60, 40, 20, 0.12);
    color-scheme: light;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; }

body {
  background: radial-gradient(ellipse at top, var(--bg-2), var(--bg) 60%) fixed, var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
}

#app {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px 64px;
}

h1, h2, .logo { font-family: Cinzel, Georgia, serif; letter-spacing: 0.02em; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.05rem; margin: 0; }

.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.gold-text { color: var(--gold); }
.bad-text { color: var(--bad); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- Botões ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.08s, background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 20px; font-size: 1rem; width: 100%; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 0.82rem; margin-top: 8px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--border)); }
.btn.gold-btn { background: color-mix(in srgb, var(--gold) 18%, var(--card-2)); border-color: var(--gold); color: var(--gold); }

.icon-btn {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 1rem;
  opacity: 0.35;
  padding: 6px;
  border-radius: 8px;
  transition: opacity 0.15s;
}
.icon-btn:hover, .icon-btn:focus-visible { opacity: 1; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-row.end { justify-content: flex-end; }

:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

/* ---------- Criação ---------- */

.creation { max-width: 560px; margin: 4vh auto 0; text-align: center; }
.logo { font-size: 2.4rem; font-weight: 800; margin: 0; background: linear-gradient(90deg, var(--gold), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); margin: 8px 0 24px; }
.creation form { padding: 20px; text-align: left; display: grid; gap: 16px; }

.field { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field legend { font-weight: 600; font-size: 0.9rem; padding: 0; margin-bottom: 6px; }
.field small { color: var(--muted); font-weight: 400; }

input:not([type=radio]):not([type=checkbox]), select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
input:focus, select:focus { border-color: var(--accent); outline: none; }

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }

.class-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.class-option input { position: absolute; opacity: 0; pointer-events: none; }
.class-card {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 12px 6px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card-2);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, transform 0.1s;
}
.class-card small { color: var(--muted); font-size: 0.75rem; }
.class-icon { font-size: 1.8rem; }
.class-option input:checked + .class-card { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--card-2)); transform: translateY(-2px); }
.class-option input:focus-visible + .class-card { outline: 2px solid var(--accent-2); }

/* ---------- Herói ---------- */

.hero {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px 16px;
  padding: 16px;
}
.avatar {
  position: relative;
  width: 84px;
  height: 84px;
  display: grid;
  place-items: center;
  font-size: 2.4rem;
  border-radius: 20px;
  background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 35%, var(--card-2)), var(--card-2));
  border: 1px solid var(--border);
}
.hero-info { display: grid; gap: 6px; min-width: 0; }
.hero-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.hero-top h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.badge { font-size: 0.78rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-2); }
.gold { margin-left: auto; font-weight: 700; color: var(--gold); }

.bar-row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; }
.bar-value { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.bar { height: 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
.bar > div { height: 100%; border-radius: inherit; transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
.bar.hp > div { background: linear-gradient(90deg, var(--hp), var(--hp-low)); }
.bar.hp.low > div { animation: pulse 1.2s infinite; }
.bar.xp > div { background: linear-gradient(90deg, var(--xp), color-mix(in srgb, var(--xp) 60%, #fff)); }
.bar.mini { height: 5px; border: 0; }
.bar.mini > div { background: var(--accent); }

@keyframes pulse { 50% { opacity: 0.55; } }

.attrs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.attr {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 2px 6px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--card-2);
  border: 1px solid transparent;
  min-width: 0;
}
.attr.class-attr { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.attr-name { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attr-level { font-weight: 700; font-variant-numeric: tabular-nums; }
.attr .bar { grid-column: 1 / -1; }

/* ---------- Abas ---------- */

.tabs {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 16px 0;
  padding: 4px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  position: sticky;
  top: 8px;
  z-index: 5;
  box-shadow: var(--shadow);
}
.tab {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 4px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
}
.tab.active { background: var(--accent); color: #fff; }
.tab:not(.active):hover { color: var(--text); background: var(--card-2); }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }

.banner { padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--good) 15%, var(--card)); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); margin: 0 0 12px; }

/* ---------- Missões ---------- */

.group { margin-bottom: 20px; }
.group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: 0.9rem; padding: 14px; border: 1px dashed var(--border); border-radius: var(--radius); margin: 0; }

.group-more { margin: -8px 0 20px; }
.group-more summary { cursor: pointer; color: var(--muted); font-size: 0.88rem; padding: 6px 0; }
.group-more .quest-list { margin-top: 6px; }

.quest-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.quest {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 10px 10px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: opacity 0.2s, border-color 0.2s;
}
.quest:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.quest.is-done { opacity: 0.6; }
.quest.is-done .quest-title { text-decoration: line-through; }
.quest-control { display: flex; align-items: center; gap: 6px; }
.quest-body { min-width: 0; display: grid; gap: 4px; }
.quest-title { font-weight: 600; overflow-wrap: anywhere; }

.check-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: var(--bg);
  color: #fff;
  font-size: 1.1rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.check-btn:hover { border-color: var(--xp); }
.check-btn.done { background: var(--xp); border-color: var(--xp); animation: pop 0.25s; }

.habit-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  font-size: 1.3rem;
  font-weight: 800;
  color: #fff;
  cursor: pointer;
  transition: transform 0.1s, filter 0.15s;
}
.habit-btn:active { transform: scale(0.9); }
.habit-btn.good { background: var(--xp); }
.habit-btn.bad { background: var(--hp); }
.count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

@keyframes pop { 50% { transform: scale(1.18); } }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
.chip.reward { color: var(--good); }
.chip.streak { color: #ff9f43; }
.chip.bad { color: var(--bad); }
.chip.diff-hard { color: #ff9f43; }
.chip.diff-epic { color: var(--accent-2); }

/* ---------- Loja ---------- */

.shop, .achievements, .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.shop-item { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; padding: 12px; }
.shop-icon { font-size: 1.6rem; }
.shop-body { display: grid; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Conquistas ---------- */

.achievements { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.achievement { display: flex; gap: 12px; padding: 12px; opacity: 0.55; }
.achievement.unlocked { opacity: 1; border-color: color-mix(in srgb, var(--gold) 50%, var(--border)); }
.achievement p { margin: 2px 0; }
.ach-icon { font-size: 1.8rem; }

/* ---------- Diário ---------- */

.log li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 2px; border-bottom: 1px solid var(--border); }
.log-text { overflow-wrap: anywhere; }

/* ---------- Ficha ---------- */

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { display: grid; gap: 4px; padding: 12px 14px; }
.stat-value { font-size: 1.6rem; font-weight: 600; }
.rules, .settings { padding: 16px; margin-bottom: 12px; }
.rules ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.inline-form { display: flex; gap: 8px; margin-top: 12px; }

/* ---------- Modal ---------- */

dialog {
  width: min(480px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--card);
  color: var(--text);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
dialog::backdrop { background: rgba(10, 6, 20, 0.6); backdrop-filter: blur(3px); }
.modal-inner { padding: 20px; }
.modal-inner form { display: grid; gap: 14px; }
.modal-inner h2 { margin-bottom: 4px; }

.segmented { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
.segmented input, .weekdays input { position: absolute; opacity: 0; pointer-events: none; }
.segmented span, .weekdays span {
  display: block;
  text-align: center;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card-2);
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 600;
}
.segmented input:checked + span, .weekdays input:checked + span { background: color-mix(in srgb, var(--accent) 22%, var(--card-2)); border-color: var(--accent); }
.segmented input:focus-visible + span, .weekdays input:focus-visible + span { outline: 2px solid var(--accent-2); }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.weekdays span { padding: 8px 0; font-size: 0.78rem; }

.celebrate { text-align: center; display: grid; gap: 8px; justify-items: center; }
.celebrate p { margin: 0; }
.celebrate .btn { margin-top: 10px; }
.big-icon { font-size: 3.2rem; animation: pop 0.5s; }
.missed { text-align: left; margin: 0; padding-left: 18px; }

/* ---------- Toasts ---------- */

.toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 50; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--card-2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-weight: 600;
  animation: toast-in 0.25s ease-out;
  transition: opacity 0.4s, transform 0.4s;
}
.toast.good { border-color: var(--good); }
.toast.bad { border-color: var(--bad); }
.toast.gold { border-color: var(--gold); }
.toast.out { opacity: 0; transform: translateY(8px); }
.toast-icon { font-size: 1.2rem; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }

/* ---------- Telas pequenas ---------- */

@media (max-width: 640px) {
  .attrs { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .attr { grid-template-columns: 1fr; justify-items: center; padding: 6px 4px; text-align: center; }
  .attr-name { display: none; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .avatar { width: 68px; height: 68px; font-size: 2rem; }
  .avatar-item { width: 24px; height: 24px; font-size: 0.8rem; }
  .shop-item { grid-template-columns: auto 1fr auto; }
  .shop-item .icon-btn { grid-column: 3; }
}

@media (max-width: 760px) {
  .tab-label { display: none; }
  .tab { font-size: 1.15rem; padding: 9px 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Avatar com equipamentos ---------- */

.avatar-class { line-height: 1; }
.avatar-item {
  position: absolute;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  font-size: 0.95rem;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--tier, var(--border));
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}
.pos-top { top: -10px; left: 50%; transform: translateX(-50%); }
.pos-top-right { top: -6px; right: -8px; }
.pos-right { bottom: 6px; right: -10px; }
.pos-left { bottom: 6px; left: -10px; }
.pos-bottom-left { bottom: -10px; left: 50%; transform: translateX(-50%); }
.avatar.big { width: 112px; height: 112px; font-size: 3.2rem; flex: none; margin: 12px; }
.avatar.big .avatar-item { width: 36px; height: 36px; font-size: 1.2rem; }

.tier-0 { --tier: #9a93a8; }
.tier-1 { --tier: #4cc38a; }
.tier-2 { --tier: #4c9bff; }
.tier-3 { --tier: #b67bff; }
.tier-4 { --tier: #f2a93b; }

/* ---------- Chefe ---------- */

.boss { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; margin-bottom: 16px; border-color: color-mix(in srgb, var(--hp) 45%, var(--border)); }
.boss.defeated { border-color: color-mix(in srgb, var(--gold) 55%, var(--border)); }
.boss-icon { font-size: 2.6rem; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 16px; background: color-mix(in srgb, var(--hp) 14%, var(--card-2)); }
.boss.defeated .boss-icon { background: color-mix(in srgb, var(--gold) 16%, var(--card-2)); }
.boss-body { display: grid; gap: 4px; min-width: 0; }
.boss-top { display: flex; justify-content: space-between; gap: 8px; }
.boss-name { font-family: Cinzel, Georgia, serif; font-size: 1.05rem; }
.boss .bar-row { grid-template-columns: 1fr auto; }
.bar.boss-bar > div { background: linear-gradient(90deg, #a2264a, var(--hp)); }

/* ---------- Equipamento ---------- */

.gear-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 8px; margin-bottom: 18px; }
.gear-top p { margin: 4px 0 8px; }
.gear-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.gear-item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-left: 4px solid var(--tier); }
.gear-item.locked { opacity: 0.5; }
.gear-item.equipped { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
.gear-icon { font-size: 1.6rem; }
.gear-body { display: grid; min-width: 0; }
.tier-label { color: var(--muted); font-weight: 600; }
.small-btn { padding: 6px 10px; font-size: 0.82rem; }
.new-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.new-item { padding: 4px 10px; border-radius: 999px; border: 2px solid var(--tier); font-weight: 600; font-size: 0.85rem; }

/* ---------- Gráficos ---------- */

.chart-card { padding: 16px; margin-bottom: 12px; }
.chart-card > p { margin: 2px 0 8px; }
.chart { width: 100%; min-height: 190px; }
.chart-svg { display: block; overflow: visible; }
.chart-svg .grid { stroke: var(--border); stroke-width: 1; opacity: 0.6; }
.chart-svg .axis { stroke: var(--border); stroke-width: 1; }
.chart-svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart-svg .value { fill: var(--text); font-size: 12px; font-weight: 600; }
.chart-svg .mark { fill: var(--chart); }
.chart-svg .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-svg .area { fill: var(--chart); opacity: 0.1; }
.chart-svg .end-dot, .chart-svg .hover-dot { fill: var(--chart); stroke: var(--card); stroke-width: 2; }
.chart-svg .hit { fill: transparent; outline: none; cursor: pointer; }
.chart-svg .guide { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.chart-svg .hover-dot { opacity: 0; }
.chart-svg g.hit.active .guide, .chart-svg g.hit:focus-visible .guide { opacity: 0.6; }
.chart-svg g.hit.active .hover-dot, .chart-svg g.hit:focus-visible .hover-dot { opacity: 1; }
.chart-svg rect.hit.active, .chart-svg rect.hit:focus-visible { fill: var(--chart); opacity: 0.08; }

.chart-tip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  display: grid;
  gap: 1px;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--card-2);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  font-size: 0.8rem;
}
.chart-tip strong { font-size: 0.95rem; }
.chart-tip span { color: var(--muted); }

.table-view { margin-top: 6px; }
.table-view summary { cursor: pointer; color: var(--muted); font-size: 0.82rem; }
.table-view table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.table-view th, .table-view td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.table-view th { color: var(--muted); font-weight: 600; }

.hbars { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.hbars li { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: center; }
.hbar-label { font-size: 0.88rem; }
.hbar-track { height: 12px; }
.hbar-fill { display: block; height: 100%; min-width: 2px; background: var(--chart); border-radius: 0 4px 4px 0; }
.hbar-value { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

@media (max-width: 480px) {
  .hbars li { grid-template-columns: 1fr auto; }
  .hbar-track { grid-column: 1 / -1; grid-row: 2; }
}

.boot-msg { max-width: 520px; margin: 12vh auto 0; text-align: center; }
.boot-msg h1 { font-size: 2rem; margin-bottom: 12px; }
</style>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="boot-msg">
      <h1>Rotina RPG</h1>
      <p>Carregando…</p>
      <noscript><p>Este app precisa de JavaScript. Ative o JavaScript no navegador.</p></noscript>
    </div>
  </main>
  <script>
    // Mostra o problema na tela em vez de deixar a página em branco.
    (function () {
      var lastError = '';
      function fail() {
        var app = document.getElementById('app');
        if (!app || window.RoutineRPGStarted) return;
        app.innerHTML = '<div class="boot-msg"><h1>Rotina RPG</h1><p>Não foi possível iniciar o app.</p>' +
          (lastError ? '<p><small>' + lastError.replace(/</g, '&lt;') + '</small></p>' : '') +
          '<p>Use uma versão atual do Chrome, Edge ou Firefox. Se baixou o ZIP, extraia antes de abrir o index.html.</p></div>';
      }
      window.addEventListener('error', function (e) {
        // Ícones ou manifesto ausentes não impedem o app de rodar.
        if (e.target && e.target !== window && e.target.tagName !== 'SCRIPT') return;
        lastError = String(e.message || (e.target && e.target.src ? 'Arquivo não encontrado: ' + e.target.src : ''));
        fail();
      }, true);
      window.addEventListener('load', fail);
    })();
  </script>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <dialog id="modal"></dialog>
  <script>
// Regras do jogo: funções puras sobre o estado, sem DOM.
// Funciona no navegador (window.RoutineRPG) e no Node (module.exports).
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.RoutineRPG = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const VERSION = 2;
  const MAX_CATCHUP_DAYS = 7;
  const MAX_LOG = 150;
  const MAX_HISTORY_DAYS = 400;
  const REST_HEAL = 0.1;

  const ATTRIBUTES = {
    str: { name: 'Força', icon: '💪', hint: 'Exercício, esforço físico' },
    int: { name: 'Inteligência', icon: '📚', hint: 'Estudo, leitura, trabalho' },
    wis: { name: 'Sabedoria', icon: '🧘', hint: 'Meditação, organização, reflexão' },
    cha: { name: 'Carisma', icon: '🎭', hint: 'Amigos, família, criatividade' },
    vit: { name: 'Vitalidade', icon: '🍎', hint: 'Sono, alimentação, saúde' },
  };

  const CLASSES = {
    guerreiro: { name: 'Guerreiro', icon: '⚔️', attr: 'str' },
    mago: { name: 'Mago', icon: '🔮', attr: 'int' },
    monge: { name: 'Monge', icon: '☯️', attr: 'wis' },
    bardo: { name: 'Bardo', icon: '🎻', attr: 'cha' },
    druida: { name: 'Druida', icon: '🌿', attr: 'vit' },
  };

  const DIFFICULTY = {
    easy: { name: 'Fácil', xp: 10, gold: 5, damage: 3 },
    medium: { name: 'Média', xp: 25, gold: 10, damage: 5 },
    hard: { name: 'Difícil', xp: 50, gold: 20, damage: 8 },
    epic: { name: 'Épica', xp: 100, gold: 40, damage: 12 },
  };

  const CLASS_BONUS = 0.2;
  const STREAK_BONUS_PER_DAY = 0.1;
  const STREAK_BONUS_CAP = 10;

  // ---------- Equipamentos ----------
  // Cada espaço tem um tipo de bônus; os itens são liberados por nível.

  const SLOTS = {
    weapon: { name: 'Arma', effect: 'bossDmg', desc: (v) => `+${v}% de dano no chefe` },
    shield: { name: 'Escudo', effect: 'defense', desc: (v) => `−${v}% de dano recebido` },
    helmet: { name: 'Elmo', effect: 'xp', desc: (v) => `+${v}% de XP` },
    amulet: { name: 'Amuleto', effect: 'gold', desc: (v) => `+${v}% de ouro` },
    pet: { name: 'Companheiro', effect: 'rest', desc: (v) => `+${v}% de vida ao descansar` },
  };

  const TIERS = ['Comum', 'Incomum', 'Raro', 'Épico', 'Lendário'];

  const EQUIPMENT = [
    { id: 'graveto', slot: 'weapon', icon: '🪵', name: 'Graveto Robusto', level: 1, value: 0 },
    { id: 'adaga', slot: 'weapon', icon: '🗡️', name: 'Adaga de Bronze', level: 3, value: 10 },
    { id: 'arco', slot: 'weapon', icon: '🏹', name: 'Arco Élfico', level: 6, value: 20 },
    { id: 'espada', slot: 'weapon', icon: '⚔️', name: 'Espada Rúnica', level: 10, value: 30 },
    { id: 'tridente', slot: 'weapon', icon: '🔱', name: 'Tridente dos Mares', level: 15, value: 50 },

    { id: 'panela', slot: 'shield', icon: '🍳', name: 'Tampa de Panela', level: 2, value: 5 },
    { id: 'carvalho', slot: 'shield', icon: '🛡️', name: 'Escudo de Carvalho', level: 5, value: 10 },
    { id: 'aco', slot: 'shield', icon: '🔰', name: 'Escudo de Aço', level: 9, value: 15 },
    { id: 'casco', slot: 'shield', icon: '🐢', name: 'Casco Ancestral', level: 14, value: 25 },

    { id: 'bone', slot: 'helmet', icon: '🧢', name: 'Boné de Viagem', level: 1, value: 0 },
    { id: 'chapeu', slot: 'helmet', icon: '🎩', name: 'Chapéu de Aventureiro', level: 4, value: 5 },
    { id: 'elmo', slot: 'helmet', icon: '⛑️', name: 'Elmo de Ferro', level: 8, value: 10 },
    { id: 'coroa', slot: 'helmet', icon: '👑', name: 'Coroa do Reino', level: 12, value: 20 },

    { id: 'contas', slot: 'amulet', icon: '📿', name: 'Colar de Contas', level: 3, value: 5 },
    { id: 'anel', slot: 'amulet', icon: '💍', name: 'Anel de Prata', level: 7, value: 10 },
    { id: 'olho', slot: 'amulet', icon: '🧿', name: 'Olho Místico', level: 11, value: 15 },
    { id: 'joia', slot: 'amulet', icon: '💎', name: 'Joia do Dragão', level: 16, value: 25 },

    { id: 'rato', slot: 'pet', icon: '🐀', name: 'Ratinho Corajoso', level: 2, value: 5 },
    { id: 'gato', slot: 'pet', icon: '🐈', name: 'Gato Malhado', level: 5, value: 10 },
    { id: 'coruja', slot: 'pet', icon: '🦉', name: 'Coruja Sábia', level: 9, value: 15 },
    { id: 'lobo', slot: 'pet', icon: '🐺', name: 'Lobo Fiel', level: 13, value: 20 },
    { id: 'dragao', slot: 'pet', icon: '🐉', name: 'Dragãozinho', level: 20, value: 30 },
  ];

  // Raridade = posição do item dentro do seu espaço; o último é sempre lendário.
  EQUIPMENT.forEach((item) => {
    const same = EQUIPMENT.filter((i) => i.slot === item.slot);
    const pos = same.indexOf(item);
    item.tier = pos === same.length - 1 ? TIERS.length - 1 : Math.min(pos, TIERS.length - 2);
  });

  function findItem(id) {
    return EQUIPMENT.find((i) => i.id === id) || null;
  }

  function isUnlocked(state, item) {
    return heroLevel(state) >= item.level;
  }

  function bestUnlocked(state, slot) {
    const items = EQUIPMENT.filter((i) => i.slot === slot && isUnlocked(state, i));
    return items.length ? items[items.length - 1] : null;
  }

  function equippedItem(state, slot) {
    const item = findItem(state.hero.equipment[slot]);
    return item && item.slot === slot && isUnlocked(state, item) ? item : null;
  }

  function bonuses(state) {
    const b = { bossDmg: 0, defense: 0, xp: 0, gold: 0, rest: 0 };
    Object.keys(SLOTS).forEach((slot) => {
      const item = equippedItem(state, slot);
      if (item) b[SLOTS[slot].effect] += item.value / 100;
    });
    return b;
  }

  function equip(state, itemId) {
    const item = findItem(itemId);
    if (!item || !isUnlocked(state, item)) return false;
    state.hero.equipment[item.slot] = item.id;
    return true;
  }

  // Equipa automaticamente o que acabou de ser liberado (é sempre melhor).
  function equipNewUnlocks(state, fromLevel, toLevel) {
    const items = EQUIPMENT.filter((i) => i.level > fromLevel && i.level <= toLevel);
    items.forEach((i) => (state.hero.equipment[i.slot] = i.id));
    return items;
  }

  // ---------- Chefes semanais ----------

  const BOSSES = [
    { icon: '👺', name: 'Goblin da Procrastinação' },
    { icon: '🐙', name: 'Kraken das Notificações' },
    { icon: '🧌', name: 'Troll da Bagunça' },
    { icon: '🧛', name: 'Vampiro da Madrugada' },
    { icon: '🗿', name: 'Golem do Sedentarismo' },
    { icon: '🐍', name: 'Hidra das Distrações' },
    { icon: '🧟', name: 'Zumbi do Cansaço' },
    { icon: '🐂', name: 'Minotauro do Estresse' },
    { icon: '👻', name: 'Espectro da Desculpa' },
    { icon: '🐲', name: 'Dragão da Preguiça' },
  ];

  const BOSS_MIN_HP = 100;
  const BOSS_HP_SHARE = 0.8; // fração do XP-base da semana necessária para vencer
  const BOSS_ESCAPE_DAMAGE = 15;

  // ---------- Datas (chaves locais AAAA-MM-DD) ----------

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function todayKey(date) {
    const d = date || new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function parseKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d, 12);
  }

  function addDays(key, n) {
    const d = parseKey(key);
    d.setDate(d.getDate() + n);
    return todayKey(d);
  }

  function dayOfWeek(key) {
    return parseKey(key).getDay();
  }

  // Semanas começam na segunda-feira.
  function weekStart(key) {
    return addDays(key, -((dayOfWeek(key) + 6) % 7));
  }

  // ---------- Níveis ----------

  // XP total para chegar ao nível n: 0, 100, 300, 600, 1000...
  function xpForLevel(n, base) {
    const b = base || 50;
    return b * (n - 1) * n;
  }

  function levelFromXp(xp, base) {
    let n = 1;
    while (xpForLevel(n + 1, base) <= xp) n++;
    return n;
  }

  function levelProgress(xp, base) {
    const level = levelFromXp(xp, base);
    const start = xpForLevel(level, base);
    const end = xpForLevel(level + 1, base);
    return { level, current: xp - start, needed: end - start };
  }

  const ATTR_BASE = 25;

  function maxHp(level) {
    return 50 + (level - 1) * 5;
  }

  function heroLevel(state) {
    return levelFromXp(state.hero.xp);
  }

  // ---------- Estado ----------

  let idCounter = 0;
  function uid() {
    idCounter = (idCounter + 1) % 1e6;
    return Date.now().toString(36) + idCounter.toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function defaultEquipment() {
    const eq = {};
    Object.keys(SLOTS).forEach((slot) => {
      const first = EQUIPMENT.find((i) => i.slot === slot && i.level <= 1);
      eq[slot] = first ? first.id : null;
    });
    return eq;
  }

  function createState(name, cls, today) {
    const key = today || todayKey();
    const attrs = {};
    Object.keys(ATTRIBUTES).forEach((a) => (attrs[a] = 0));
    const state = {
      version: VERSION,
      hero: {
        name: name || 'Aventureiro',
        cls: CLASSES[cls] ? cls : 'guerreiro',
        xp: 0,
        hp: maxHp(1),
        gold: 0,
        attrs,
        equipment: defaultEquipment(),
      },
      quests: [],
      rewards: [
        { id: uid(), title: 'Poção de Vida', cost: 25, heal: 20, builtin: true },
        { id: uid(), title: 'Um episódio de série', cost: 50 },
        { id: uid(), title: 'Sobremesa favorita', cost: 80 },
      ],
      boss: null,
      history: {},
      achievements: {},
      log: [],
      stats: { completed: 0, goldEarned: 0, rewardsBought: 0, defeats: 0, bestStreak: 0, bossesDefeated: 0, bossesSeen: 0 },
      lastProcessed: key,
      createdAt: key,
    };
    addLog(state, '🌅', `${state.hero.name}, o ${CLASSES[state.hero.cls].name}, inicia sua jornada!`);
    return state;
  }

  // Atualiza progresso salvo em versões anteriores sem perder nada.
  function migrate(state) {
    if (!state || typeof state !== 'object') return state;
    if (state.version === 1) {
      state.hero.equipment = defaultEquipment();
      equipNewUnlocks(state, 1, heroLevel(state));
      state.boss = null;
      state.history = {};
      state.stats.bossesDefeated = 0;
      state.stats.bossesSeen = 0;
      state.version = 2;
    }
    return state;
  }

  function addLog(state, icon, text, ts) {
    state.log.unshift({ ts: ts || Date.now(), icon, text });
    if (state.log.length > MAX_LOG) state.log.length = MAX_LOG;
  }

  function findQuest(state, id) {
    return state.quests.find((q) => q.id === id);
  }

  function addQuest(state, data, today) {
    const key = today || todayKey();
    const quest = {
      id: uid(),
      title: String(data.title || '').trim() || 'Missão sem nome',
      type: ['daily', 'habit', 'todo'].includes(data.type) ? data.type : 'daily',
      attr: ATTRIBUTES[data.attr] ? data.attr : 'str',
      difficulty: DIFFICULTY[data.difficulty] ? data.difficulty : 'medium',
      createdAt: key,
    };
    if (quest.type === 'daily') {
      const days = Array.isArray(data.days) ? data.days.filter((d) => d >= 0 && d <= 6) : [];
      quest.days = days.length ? [...new Set(days)].sort() : [0, 1, 2, 3, 4, 5, 6];
      quest.streak = 0;
      quest.bestStreak = 0;
      quest.completions = [];
    } else if (quest.type === 'habit') {
      quest.polarity = data.polarity === 'bad' ? 'bad' : 'good';
      quest.count = 0;
      quest.countDate = key;
    } else {
      quest.done = false;
    }
    state.quests.push(quest);
    return quest;
  }

  function removeQuest(state, id) {
    state.quests = state.quests.filter((q) => q.id !== id);
  }

  function isScheduled(quest, key) {
    return quest.type === 'daily' && quest.days.includes(dayOfWeek(key));
  }

  function isDoneOn(quest, key) {
    if (quest.type === 'daily') return quest.completions.includes(key);
    if (quest.type === 'todo') return quest.done;
    return false;
  }

  function habitCount(quest, key) {
    return quest.countDate === key ? quest.count : 0;
  }

  // ---------- Histórico (para os gráficos) ----------

  function historyDay(state, key) {
    if (!state.history[key]) state.history[key] = { done: 0 };
    return state.history[key];
  }

  function recordDay(state, key) {
    const day = historyDay(state, key || todayKey());
    day.xp = state.hero.xp;
    day.gold = state.hero.gold;
    const keys = Object.keys(state.history);
    if (keys.length > MAX_HISTORY_DAYS) {
      keys.sort().slice(0, keys.length - MAX_HISTORY_DAYS).forEach((k) => delete state.history[k]);
    }
  }

  function dailyTotals(state, key) {
    let due = 0;
    let done = 0;
    state.quests.forEach((q) => {
      if (q.type !== 'daily' || q.createdAt > key || !isScheduled(q, key)) return;
      due++;
      if (isDoneOn(q, key)) done++;
    });
    return { due, done };
  }

  // ---------- Recompensas e dano ----------

  function computeReward(state, quest) {
    const diff = DIFFICULTY[quest.difficulty];
    const b = bonuses(state);
    const streak = quest.type === 'daily' ? Math.min(quest.streak, STREAK_BONUS_CAP) : 0;
    const streakMult = 1 + streak * STREAK_BONUS_PER_DAY;
    const classMult = CLASSES[state.hero.cls].attr === quest.attr ? 1 + CLASS_BONUS : 1;
    return {
      xp: Math.round(diff.xp * streakMult * classMult * (1 + b.xp)),
      gold: Math.round(diff.gold * streakMult * (1 + b.gold)),
    };
  }

  function grant(state, attr, xp, gold) {
    const hero = state.hero;
    const beforeLevel = heroLevel(state);
    const beforeAttr = attr ? levelFromXp(hero.attrs[attr], ATTR_BASE) : 0;
    hero.xp += xp;
    if (attr) hero.attrs[attr] += xp;
    hero.gold += gold;
    state.stats.goldEarned += gold;
    const level = heroLevel(state);
    const events = { xp, gold, levelUp: null, attrUp: null, newItems: [] };
    if (level > beforeLevel) {
      hero.hp = maxHp(level);
      events.levelUp = level;
      addLog(state, '⭐', `Subiu para o nível ${level}! Vida restaurada.`);
      events.newItems = equipNewUnlocks(state, beforeLevel, level);
      events.newItems.forEach((i) => addLog(state, i.icon, `Novo equipamento: ${i.name}!`));
    }
    if (attr) {
      const attrLevel = levelFromXp(hero.attrs[attr], ATTR_BASE);
      if (attrLevel > beforeAttr) {
        events.attrUp = { attr, level: attrLevel };
        addLog(state, ATTRIBUTES[attr].icon, `${ATTRIBUTES[attr].name} chegou ao nível ${attrLevel}.`);
      }
    }
    return events;
  }

  function revoke(state, attr, xp, gold) {
    const hero = state.hero;
    hero.xp = Math.max(0, hero.xp - xp);
    hero.attrs[attr] = Math.max(0, hero.attrs[attr] - xp);
    hero.gold = Math.max(0, hero.gold - gold);
    state.stats.goldEarned = Math.max(0, state.stats.goldEarned - gold);
    hero.hp = Math.min(hero.hp, maxHp(heroLevel(state)));
  }

  // Aplica dano (reduzido pelo escudo); ao chegar a 0 de vida o herói é derrotado:
  // perde o progresso do nível atual e metade do ouro, e volta com vida cheia.
  function damage(state, amount, reason) {
    const hero = state.hero;
    const taken = Math.max(1, Math.round(amount * (1 - bonuses(state).defense)));
    hero.hp -= taken;
    if (hero.hp > 0) return { damage: taken, defeated: false };
    const level = heroLevel(state);
    const lostGold = Math.floor(hero.gold / 2);
    hero.xp = xpForLevel(level);
    hero.gold -= lostGold;
    hero.hp = maxHp(level);
    state.stats.defeats++;
    addLog(state, '💀', `Derrotado${reason ? ` por ${reason}` : ''}! Perdeu o progresso do nível e ${lostGold} de ouro.`);
    return { damage: taken, defeated: true, lostGold };
  }

  function heal(state, amount) {
    const hero = state.hero;
    const max = maxHp(heroLevel(state));
    const before = hero.hp;
    hero.hp = Math.min(max, hero.hp + amount);
    return hero.hp - before;
  }

  // ---------- Chefe ----------

  function bossHpFor(state, today) {
    const start = weekStart(today);
    let expected = 0;
    for (let i = 0; i < 7; i++) {
      const day = addDays(start, i);
      if (day < today) continue;
      state.quests.forEach((q) => {
        if (q.type === 'daily' && isScheduled(q, day)) expected += DIFFICULTY[q.difficulty].xp;
      });
    }
    return Math.max(BOSS_MIN_HP, Math.round((expected * BOSS_HP_SHARE) / 10) * 10);
  }

  function bossReward(state) {
    const level = heroLevel(state);
    return { xp: 40 + level * 10, gold: 25 + level * 5 };
  }

  // Garante que existe um chefe para a semana atual; o da semana passada,
  // se não foi derrotado, foge e dá um último golpe.
  function ensureBoss(state, today) {
    const key = today || todayKey();
    const week = weekStart(key);
    const result = { escaped: null, spawned: null };
    const old = state.boss;
    if (old && old.week === week) return result;
    if (old && !old.defeated) {
      const dmg = Math.ceil((BOSS_ESCAPE_DAMAGE * old.hp) / old.maxHp);
      const hit = damage(state, dmg, old.name);
      result.escaped = { name: old.name, icon: old.icon, damage: hit.damage, defeated: hit.defeated };
      addLog(state, old.icon, `${old.name} escapou e acertou um último golpe (−${hit.damage} vida).`);
    }
    const base = BOSSES[state.stats.bossesSeen % BOSSES.length];
    const hp = bossHpFor(state, key);
    state.stats.bossesSeen++;
    state.boss = { week, icon: base.icon, name: base.name, maxHp: hp, hp, defeated: false };
    result.spawned = state.boss;
    addLog(state, base.icon, `${base.name} apareceu! Cumpra suas missões da semana para derrotá-lo.`);
    return result;
  }

  function hitBoss(state, xp) {
    const boss = state.boss;
    if (!boss || boss.defeated) return null;
    const dmg = Math.max(1, Math.round(xp * (1 + bonuses(state).bossDmg)));
    boss.hp = Math.max(0, boss.hp - dmg);
    const hit = { damage: dmg, week: boss.week, defeated: false };
    if (boss.hp === 0) {
      boss.defeated = true;
      state.stats.bossesDefeated++;
      const reward = bossReward(state);
      addLog(state, '🏅', `${boss.name} foi derrotado! +${reward.xp} XP, +${reward.gold} ouro.`);
      hit.defeated = true;
      hit.reward = reward;
      hit.events = grant(state, null, reward.xp, reward.gold);
    }
    return hit;
  }

  function healBoss(state, amount) {
    const boss = state.boss;
    if (!boss || boss.defeated) return 0;
    const before = boss.hp;
    boss.hp = Math.min(boss.maxHp, boss.hp + amount);
    return boss.hp - before;
  }

  // ---------- Ações ----------

  function rewardResult(state, events, boss) {
    const result = { type: 'reward', ...events, boss };
    if (boss && boss.events) {
      // Subidas de nível causadas pelo prêmio do chefe também contam.
      result.levelUp = boss.events.levelUp || result.levelUp;
      result.newItems = (result.newItems || []).concat(boss.events.newItems);
    }
    result.achievements = checkAchievements(state);
    return result;
  }

  function completeQuest(state, id, today) {
    const key = today || todayKey();
    const quest = findQuest(state, id);
    if (!quest) return null;

    if (quest.type === 'habit') {
      if (quest.countDate !== key) {
        quest.count = 0;
        quest.countDate = key;
      }
      quest.count++;
      if (quest.polarity === 'bad') {
        const dmg = DIFFICULTY[quest.difficulty].damage;
        const result = damage(state, dmg, quest.title);
        const bossHealed = healBoss(state, dmg * 2);
        if (!result.defeated) addLog(state, '🩸', `Cedeu a "${quest.title}" e perdeu ${result.damage} de vida.`);
        return { type: 'damage', ...result, bossHealed, achievements: checkAchievements(state) };
      }
      const reward = computeReward(state, quest);
      const events = grant(state, quest.attr, reward.xp, reward.gold);
      state.stats.completed++;
      historyDay(state, key).done++;
      addLog(state, '✨', `"${quest.title}": +${reward.xp} XP, +${reward.gold} ouro.`);
      return rewardResult(state, events, hitBoss(state, reward.xp));
    }

    if (isDoneOn(quest, key)) return null;
    if (quest.type === 'daily') {
      quest.streak++;
      quest.bestStreak = Math.max(quest.bestStreak, quest.streak);
      state.stats.bestStreak = Math.max(state.stats.bestStreak, quest.streak);
      quest.completions.push(key);
      if (quest.completions.length > 60) quest.completions.shift();
    } else {
      quest.done = true;
      quest.doneAt = key;
    }
    const reward = computeReward(state, quest);
    const events = grant(state, quest.attr, reward.xp, reward.gold);
    state.stats.completed++;
    historyDay(state, key).done++;
    const streakText = quest.type === 'daily' && quest.streak > 1 ? ` (sequência de ${quest.streak})` : '';
    addLog(state, '✅', `Missão "${quest.title}" concluída${streakText}: +${reward.xp} XP, +${reward.gold} ouro.`);
    const boss = hitBoss(state, reward.xp);
    quest.lastGrant = { key, xp: reward.xp, gold: reward.gold, boss: boss && !boss.defeated ? { week: boss.week, damage: boss.damage } : null };
    return rewardResult(state, events, boss);
  }

  function undoQuest(state, id, today) {
    const key = today || todayKey();
    const quest = findQuest(state, id);
    if (!quest || quest.type === 'habit' || !isDoneOn(quest, key)) return false;
    const g = quest.lastGrant;
    if (quest.type === 'daily') {
      if (!g || g.key !== key) return false;
      quest.completions = quest.completions.filter((c) => c !== key);
      quest.streak = Math.max(0, quest.streak - 1);
    } else {
      quest.done = false;
      delete quest.doneAt;
    }
    if (g) {
      revoke(state, quest.attr, g.xp, g.gold);
      if (g.boss && state.boss && state.boss.week === g.boss.week) healBoss(state, g.boss.damage);
      if (state.history[g.key]) state.history[g.key].done = Math.max(0, state.history[g.key].done - 1);
    }
    delete quest.lastGrant;
    state.stats.completed = Math.max(0, state.stats.completed - 1);
    addLog(state, '↩️', `Desfez "${quest.title}".`);
    return true;
  }

  function addReward(state, title, cost) {
    const reward = { id: uid(), title: String(title || '').trim() || 'Recompensa', cost: Math.max(1, Math.round(Number(cost) || 1)) };
    state.rewards.push(reward);
    return reward;
  }

  function removeReward(state, id) {
    state.rewards = state.rewards.filter((r) => r.id !== id || r.builtin);
  }

  function buyReward(state, id) {
    const reward = state.rewards.find((r) => r.id === id);
    if (!reward) return { ok: false, reason: 'not-found' };
    if (state.hero.gold < reward.cost) return { ok: false, reason: 'gold' };
    if (reward.heal && state.hero.hp >= maxHp(heroLevel(state))) return { ok: false, reason: 'full-hp' };
    state.hero.gold -= reward.cost;
    state.stats.rewardsBought++;
    let healed = 0;
    if (reward.heal) healed = heal(state, reward.heal);
    addLog(state, '🛒', `Comprou "${reward.title}" por ${reward.cost} ouro${healed ? ` (+${healed} vida)` : ''}.`);
    return { ok: true, healed, achievements: checkAchievements(state) };
  }

  // Processa os dias que passaram desde a última abertura: diárias não feitas
  // causam dano e zeram a sequência; cada noite de descanso recupera um pouco de vida.
  // Também troca o chefe quando começa uma semana nova.
  function processRollover(state, today) {
    const key = today || todayKey();
    const summary = { days: 0, missed: [], damage: 0, defeated: false, healed: 0, boss: null };
    if (!state.lastProcessed) state.lastProcessed = key;
    if (state.lastProcessed < key) {
      let day = state.lastProcessed;
      const earliest = addDays(key, -MAX_CATCHUP_DAYS);
      if (day < earliest) day = earliest;
      for (; day < key; day = addDays(day, 1)) {
        summary.days++;
        const totals = dailyTotals(state, day);
        const entry = historyDay(state, day);
        entry.due = totals.due;
        entry.dailyDone = totals.done;
        state.quests.forEach((q) => {
          if (q.type !== 'daily' || q.createdAt > day || !isScheduled(q, day) || isDoneOn(q, day)) return;
          q.streak = 0;
          const result = damage(state, DIFFICULTY[q.difficulty].damage, `"${q.title}" esquecida`);
          summary.missed.push({ title: q.title, day, damage: result.damage });
          summary.damage += result.damage;
          if (result.defeated) summary.defeated = true;
        });
        const restRate = REST_HEAL + bonuses(state).rest;
        summary.healed += heal(state, Math.ceil(maxHp(heroLevel(state)) * restRate));
      }
      state.quests.forEach((q) => {
        if (q.type === 'habit' && q.countDate !== key) {
          q.count = 0;
          q.countDate = key;
        }
      });
      if (summary.missed.length) {
        addLog(state, '⚔️', `Missões perdidas enquanto esteve fora: ${summary.missed.length} (−${summary.damage} vida).`);
      }
      state.lastProcessed = key;
    }
    summary.boss = ensureBoss(state, key);
    if (summary.boss.escaped && summary.boss.escaped.defeated) summary.defeated = true;
    recordDay(state, key);
    return summary;
  }

  // ---------- Conquistas ----------

  const ACHIEVEMENTS = [
    { id: 'first-quest', icon: '🗡️', name: 'Primeiro Passo', desc: 'Conclua sua primeira missão.', check: (s) => s.stats.completed >= 1 },
    { id: 'quests-10', icon: '🛡️', name: 'Aprendiz', desc: 'Conclua 10 missões.', check: (s) => s.stats.completed >= 10 },
    { id: 'quests-100', icon: '🏰', name: 'Veterano', desc: 'Conclua 100 missões.', check: (s) => s.stats.completed >= 100 },
    { id: 'quests-500', icon: '🐉', name: 'Lenda Viva', desc: 'Conclua 500 missões.', check: (s) => s.stats.completed >= 500 },
    { id: 'streak-7', icon: '🔥', name: 'Semana Implacável', desc: 'Sequência de 7 numa diária.', check: (s) => s.stats.bestStreak >= 7 },
    { id: 'streak-30', icon: '☄️', name: 'Disciplina de Ferro', desc: 'Sequência de 30 numa diária.', check: (s) => s.stats.bestStreak >= 30 },
    { id: 'level-5', icon: '⭐', name: 'Ascensão', desc: 'Alcance o nível 5.', check: (s) => heroLevel(s) >= 5 },
    { id: 'level-10', icon: '🌟', name: 'Herói do Reino', desc: 'Alcance o nível 10.', check: (s) => heroLevel(s) >= 10 },
    { id: 'gold-1000', icon: '💰', name: 'Tesouro do Dragão', desc: 'Ganhe 1000 de ouro no total.', check: (s) => s.stats.goldEarned >= 1000 },
    { id: 'first-reward', icon: '🎁', name: 'Merecido', desc: 'Compre uma recompensa na loja.', check: (s) => s.stats.rewardsBought >= 1 },
    { id: 'balanced', icon: '⚖️', name: 'Equilíbrio', desc: 'Todos os atributos no nível 3.', check: (s) => Object.values(s.hero.attrs).every((x) => levelFromXp(x, ATTR_BASE) >= 3) },
    { id: 'defeat', icon: '🪦', name: 'Renascido', desc: 'Seja derrotado e continue lutando.', check: (s) => s.stats.defeats >= 1 },
    { id: 'boss-1', icon: '🏅', name: 'Caçador de Chefes', desc: 'Derrote seu primeiro chefe semanal.', check: (s) => s.stats.bossesDefeated >= 1 },
    { id: 'boss-10', icon: '🎖️', name: 'Flagelo dos Monstros', desc: 'Derrote 10 chefes semanais.', check: (s) => s.stats.bossesDefeated >= 10 },
    { id: 'legendary', icon: '✴️', name: 'Equipamento Lendário', desc: 'Equipe um item lendário.', check: (s) => Object.keys(SLOTS).some((slot) => { const i = equippedItem(s, slot); return i && i.tier === TIERS.length - 1; }) },
  ];

  function checkAchievements(state) {
    const unlocked = [];
    ACHIEVEMENTS.forEach((a) => {
      if (!state.achievements[a.id] && a.check(state)) {
        state.achievements[a.id] = Date.now();
        unlocked.push(a);
        addLog(state, '🏆', `Conquista desbloqueada: ${a.name}!`);
      }
    });
    return unlocked;
  }

  // ---------- Persistência ----------

  function validate(state) {
    return !!(
      state &&
      state.version === VERSION &&
      state.hero &&
      typeof state.hero.xp === 'number' &&
      state.hero.equipment &&
      Array.isArray(state.quests) &&
      Array.isArray(state.rewards) &&
      state.history
    );
  }

  return {
    VERSION,
    ATTRIBUTES,
    CLASSES,
    DIFFICULTY,
    ACHIEVEMENTS,
    ATTR_BASE,
    SLOTS,
    TIERS,
    EQUIPMENT,
    BOSSES,
    todayKey,
    addDays,
    dayOfWeek,
    weekStart,
    xpForLevel,
    levelFromXp,
    levelProgress,
    maxHp,
    heroLevel,
    createState,
    migrate,
    addLog,
    addQuest,
    removeQuest,
    findQuest,
    isScheduled,
    isDoneOn,
    habitCount,
    dailyTotals,
    recordDay,
    computeReward,
    completeQuest,
    undoQuest,
    damage,
    heal,
    findItem,
    isUnlocked,
    bestUnlocked,
    equippedItem,
    bonuses,
    equip,
    ensureBoss,
    bossReward,
    addReward,
    removeReward,
    buyReward,
    processRollover,
    checkAchievements,
    validate,
  };
});

  <script>
// Gráficos em SVG puro (sem bibliotecas, funcionam offline).
// Cada função recebe a largura real do contêiner, para o texto não encolher no celular.
(function (root) {
  'use strict';

  const H = 190;
  const M = { top: 18, right: 14, bottom: 26, left: 38 };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function compact(v) {
    if (Math.abs(v) >= 1e6) return `${+(v / 1e6).toFixed(1)}M`;
    if (Math.abs(v) >= 1000) return `${+(v / 1000).toFixed(1)}K`;
    return String(Math.round(v));
  }

  // Máximo "redondo" e passo para 3–5 linhas de grade.
  function niceScale(max, fixedMax) {
    if (fixedMax) return { max: fixedMax, step: fixedMax / 4 };
    const m = Math.max(max, 1);
    const raw = m / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map((f) => f * mag).find((s) => s >= raw);
    const s = Math.max(1, step);
    return { max: Math.ceil(m / s) * s, step: s };
  }

  function grid(width, scale, format) {
    const plotH = H - M.top - M.bottom;
    let out = '';
    for (let v = 0; v <= scale.max + 1e-9; v += scale.step) {
      const y = M.top + plotH - (v / scale.max) * plotH;
      out += `<line class="grid" x1="${M.left}" x2="${width - M.right}" y1="${y}" y2="${y}"/>`;
      out += `<text class="tick" x="${M.left - 6}" y="${y + 4}" text-anchor="end">${esc(format(v))}</text>`;
    }
    return out;
  }

  // O último rótulo sempre aparece; um rótulo regular perto demais dele é pulado.
  function xLabels(points, xOf, every) {
    const last = points.length - 1;
    return points
      .map((p, i) => {
        const show = i === last || (i % every === 0 && last - i >= every * 0.75);
        return show ? `<text class="tick" x="${xOf(i)}" y="${H - 8}" text-anchor="middle">${esc(p.label)}</text>` : '';
      })
      .join('');
  }

  function labelEvery(n, width) {
    return Math.max(1, Math.ceil(n / Math.max(2, Math.floor((width - M.left - M.right) / 52))));
  }

  // Colunas com topo arredondado (4px) e base reta.
  function columnPath(x, y, w, base) {
    const r = Math.min(4, w / 2, (base - y) / 2);
    return `M${x},${base}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${base}Z`;
  }

  function columnChart(points, width, opts) {
    const o = opts || {};
    const format = o.format || compact;
    const plotW = width - M.left - M.right;
    const plotH = H - M.top - M.bottom;
    const base = M.top + plotH;
    const values = points.map((p) => (p.value == null ? 0 : p.value));
    const scale = niceScale(Math.max(...values, 0), o.max);
    const band = plotW / points.length;
    const barW = Math.max(2, Math.min(24, band - 2));
    const xOf = (i) => M.left + i * band + band / 2;
    const maxVal = Math.max(...values);
    const maxIdx = maxVal > 0 ? values.lastIndexOf(maxVal) : -1;

    let bars = '';
    let hits = '';
    points.forEach((p, i) => {
      const cx = xOf(i);
      if (p.value != null && p.value > 0) {
        const y = base - (p.value / scale.max) * plotH;
        bars += `<path class="mark" d="${columnPath(cx - barW / 2, y, barW, base)}"/>`;
        if (i === maxIdx) bars += `<text class="value" x="${cx}" y="${y - 5}" text-anchor="middle">${esc(format(p.value))}</text>`;
      }
      hits += `<rect class="hit" x="${M.left + i * band}" y="${M.top}" width="${band}" height="${plotH}" tabindex="0" data-tip="${esc(p.tip)}"/>`;
    });

    return `<svg class="chart-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="${esc(o.label || '')}">
      ${grid(width, scale, format)}
      <line class="axis" x1="${M.left}" x2="${width - M.right}" y1="${base}" y2="${base}"/>
      ${bars}
      ${xLabels(points, xOf, labelEvery(points.length, width))}
      ${hits}
    </svg>`;
  }

  function lineChart(points, width, opts) {
    const o = opts || {};
    const format = o.format || compact;
    const plotW = width - M.left - M.right;
    const plotH = H - M.top - M.bottom;
    const base = M.top + plotH;
    const values = points.map((p) => p.value);
    const scale = niceScale(Math.max(...values, 0), o.max);
    const step = points.length > 1 ? plotW / (points.length - 1) : 0;
    const xOf = (i) => M.left + i * step;
    const yOf = (v) => base - (v / scale.max) * plotH;
    const coords = points.map((p, i) => [xOf(i), yOf(p.value)]);
    const line = coords.map((c, i) => `${i ? 'L' : 'M'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join('');
    const area = `${line}L${xOf(points.length - 1)},${base}L${M.left},${base}Z`;
    const last = coords[coords.length - 1];
    const lastVal = points[points.length - 1].value;
    const band = Math.max(step, 6);

    const hits = points
      .map((p, i) => {
        const [x, y] = coords[i];
        return `<g class="hit" tabindex="0" data-tip="${esc(p.tip)}">
          <rect x="${x - band / 2}" y="${M.top}" width="${band}" height="${plotH}" fill="transparent"/>
          <line class="guide" x1="${x}" x2="${x}" y1="${M.top}" y2="${base}"/>
          <circle class="hover-dot" cx="${x}" cy="${y}" r="4"/>
        </g>`;
      })
      .join('');

    return `<svg class="chart-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="${esc(o.label || '')}">
      ${grid(width, scale, format)}
      <line class="axis" x1="${M.left}" x2="${width - M.right}" y1="${base}" y2="${base}"/>
      <path class="area" d="${area}"/>
      <path class="line" d="${line}"/>
      <circle class="end-dot" cx="${last[0]}" cy="${last[1]}" r="4"/>
      <text class="value" x="${last[0] - 8}" y="${last[1] - 9}" text-anchor="end">${esc(format(lastVal))}</text>
      ${xLabels(points, xOf, labelEvery(points.length, width))}
      ${hits}
    </svg>`;
  }

  root.RPGCharts = { columnChart, lineChart, compact };
})(typeof self !== 'undefined' ? self : this);
</script>
  <script>
// Interface: renderiza o estado e liga os botões às regras de game.js.
(function () {
  'use strict';

  const G = window.RoutineRPG;
  const C = window.RPGCharts;
  const STORAGE_KEY = 'rotina-rpg:v1';
  const TAB_KEY = 'rotina-rpg:tab';
  const WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const TABS = [
    { id: 'quests', icon: '📜', name: 'Missões' },
    { id: 'gear', icon: '🎒', name: 'Equipamento' },
    { id: 'shop', icon: '🛒', name: 'Loja' },
    { id: 'stats', icon: '📈', name: 'Evolução' },
    { id: 'achievements', icon: '🏆', name: 'Conquistas' },
    { id: 'log', icon: '📖', name: 'Diário' },
    { id: 'hero', icon: '⚙️', name: 'Herói' },
  ];
  // Posição de cada equipamento em volta do avatar.
  const AVATAR_SLOTS = { helmet: 'top', amulet: 'top-right', weapon: 'right', shield: 'left', pet: 'bottom-left' };

  const app = document.getElementById('app');
  const modal = document.getElementById('modal');
  const toasts = document.getElementById('toasts');
  const tip = document.createElement('div');
  tip.className = 'chart-tip';
  tip.hidden = true;
  document.body.appendChild(tip);

  let state = load();
  let tab = readTab();
  let installPrompt = null;

  // ---------- Persistência ----------

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = G.migrate(JSON.parse(raw));
      return G.validate(data) ? data : null;
    } catch (e) {
      return null;
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast('⚠️', 'Não foi possível salvar no navegador.');
    }
  }

  function readTab() {
    try {
      const t = localStorage.getItem(TAB_KEY);
      return TABS.some((x) => x.id === t) ? t : 'quests';
    } catch (e) {
      return 'quests';
    }
  }

  function setTab(t) {
    tab = t;
    try {
      localStorage.setItem(TAB_KEY, t);
    } catch (e) {
      /* preferência opcional */
    }
    render();
  }

  // ---------- Utilidades ----------

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function pct(a, b) {
    return b > 0 ? Math.max(0, Math.min(100, (a / b) * 100)) : 0;
  }

  function shortDate(key) {
    return key.split('-').reverse().slice(0, 2).join('/');
  }

  function toast(icon, text, kind) {
    const el = document.createElement('div');
    el.className = `toast ${kind || ''}`;
    el.innerHTML = `<span class="toast-icon">${icon}</span><span>${esc(text)}</span>`;
    toasts.appendChild(el);
    while (toasts.children.length > 3) toasts.firstChild.remove();
    setTimeout(() => el.classList.add('out'), 3200);
    setTimeout(() => el.remove(), 3700);
  }

  function announce(result) {
    if (!result) return;
    if (result.type === 'damage') {
      if (result.defeated) toast('💀', `Derrotado! Perdeu o progresso do nível e ${result.lostGold} de ouro.`, 'bad');
      else toast('🩸', `−${result.damage} de vida`, 'bad');
      if (result.bossHealed) toast(state.boss.icon, `${state.boss.name} recuperou ${result.bossHealed} de vida!`, 'bad');
    } else if (result.type === 'reward') {
      toast('✨', `+${result.xp} XP  ·  +${result.gold} ouro`);
      if (result.boss && !result.boss.defeated) toast(state.boss.icon, `−${result.boss.damage} no ${state.boss.name}`);
      if (result.attrUp) {
        const a = G.ATTRIBUTES[result.attrUp.attr];
        toast(a.icon, `${a.name} subiu para o nível ${result.attrUp.level}!`, 'good');
      }
      if (result.boss && result.boss.defeated) bossDefeatedModal(result.boss, result.levelUp, result.newItems);
      else if (result.levelUp) levelUpModal(result.levelUp, result.newItems);
    }
    (result.achievements || []).forEach((a) => toast('🏆', `Conquista: ${a.name}`, 'gold'));
  }

  function act(fn) {
    const result = fn();
    G.recordDay(state, G.todayKey());
    save();
    render();
    return result;
  }

  // Mantém o dia em dia mesmo com a aba aberta durante a meia-noite.
  function checkDay() {
    if (!state) return;
    const before = state.lastProcessed;
    const summary = G.processRollover(state, G.todayKey());
    save();
    if (state.lastProcessed !== before || summary.boss.spawned) {
      render();
      if (summary.missed.length || summary.healed || summary.boss.escaped || (summary.boss.spawned && summary.days)) rolloverModal(summary);
    }
  }

  // ---------- Render ----------

  function render() {
    hideTip();
    if (!state) {
      app.innerHTML = creationView();

  function questChips(q) {
    const a = G.ATTRIBUTES[q.attr];
    const d = G.DIFFICULTY[q.difficulty];
    const chips = [`<span class="chip" title="${a.name}">${a.icon} ${a.name}</span>`, `<span class="chip diff-${q.difficulty}">${d.name}</span>`];
    if (q.type === 'daily') {
      if (q.streak > 0) chips.push(`<span class="chip streak" title="Sequência atual (melhor: ${q.bestStreak})">🔥 ${q.streak}</span>`);
      if (q.days.length < 7) chips.push(`<span class="chip">${q.days.map((x) => WEEKDAYS[x]).join(' ')}</span>`);
    }
    if (q.type === 'habit' && q.polarity === 'bad') chips.push(`<span class="chip bad">−${d.damage} ❤️</span>`);
    else if (!G.isDoneOn(q, G.todayKey())) {
      const r = G.computeReward(state, q.type === 'daily' ? { ...q, streak: q.streak + 1 } : q);
      chips.push(`<span class="chip reward">+${r.xp} XP · +${r.gold} 🪙</span>`);
    }
    return chips.join('');
  }

  function questItem(q, today) {
    const done = G.isDoneOn(q, today);
    let control;
    if (q.type === 'habit') {
      const count = G.habitCount(q, today);
      control = q.polarity === 'bad'
        ? `<button class="habit-btn bad" data-action="complete" data-id="${q.id}" aria-label="Registrar deslize: ${esc(q.title)}">−</button>`
        : `<button class="habit-btn good" data-action="complete" data-id="${q.id}" aria-label="Registrar: ${esc(q.title)}">+</button>`;
      if (count) control += `<span class="count">×${count}</span>`;
    } else {
      control = `<button class="check-btn ${done ? 'done' : ''}" data-action="${done ? 'undo' : 'complete'}" data-id="${q.id}" aria-pressed="${done}" aria-label="${done ? 'Desfazer' : 'Concluir'}: ${esc(q.title)}">${done ? '✓' : ''}</button>`;
    }
    return `
      <li class="quest ${done ? 'is-done' : ''} ${q.type === 'habit' ? `habit-${q.polarity}` : ''}">
        <div class="quest-control">${control}</div>
        <div class="quest-body">
          <span class="quest-title">${esc(q.title)}</span>
          <div class="chips">${questChips(q)}</div>

        <button class="icon-btn" data-action="delete-quest" data-id="${q.id}" aria-label="Apagar ${esc(q.title)}" title="Apagar">🗑️</button>

  // ---------- Evolução ----------

  function lastDays(n) {
    const today = G.todayKey();
    const start = G.addDays(today, -(n - 1));
    const first = state.createdAt > start ? state.createdAt : start;
    const days = [];
    for (let d = first; d <= today; d = G.addDays(d, 1)) days.push(d);
    return days;
  }

  function seriesData() {
    const today = G.todayKey();
    const hist = state.history;

    const done = lastDays(30).map((d) => {
      const v = (hist[d] && hist[d].done) || 0;
      return { label: shortDate(d), value: v, tip: `${v} ${v === 1 ? 'missão' : 'missões'}|${WEEKDAYS[G.dayOfWeek(d)]} ${shortDate(d)}` };
    });

    // XP: repete o último valor conhecido nos dias sem registro.
    const sorted = Object.keys(hist).sort();
    let carry = 0;
    const xpDays = lastDays(90);
    sorted.forEach((k) => {
      if (k < xpDays[0] && typeof hist[k].xp === 'number') carry = hist[k].xp;
    });
    const xp = xpDays.map((d) => {
      if (d === today) carry = state.hero.xp;
      else if (hist[d] && typeof hist[d].xp === 'number') carry = hist[d].xp;
      return { label: shortDate(d), value: carry, tip: `${carry} XP · nível ${G.levelFromXp(carry)}|${WEEKDAYS[G.dayOfWeek(d)]} ${shortDate(d)}` };
    });

    const weeks = [];
    const thisWeek = G.weekStart(today);
    const firstWeek = G.weekStart(state.createdAt);
    for (let i = 11; i >= 0; i--) {
      const w = G.addDays(thisWeek, -7 * i);
      if (w < firstWeek) continue;
      let due = 0;
      let ok = 0;
      for (let j = 0; j < 7; j++) {
        const d = G.addDays(w, j);
        if (d > today) break;
        const t = d === today ? G.dailyTotals(state, d) : { due: (hist[d] && hist[d].due) || 0, done: (hist[d] && hist[d].dailyDone) || 0 };
        due += t.due;
        ok += t.done;
      }
      const value = due ? Math.round((ok / due) * 100) : null;
      weeks.push({ label: shortDate(w), value, due, ok, tip: `${value == null ? 'Sem diárias' : `${value}% (${ok} de ${due})`}|Semana de ${shortDate(w)}` });
    }
    return { done, xp, weeks };
  }

  function dataTable(head, rows) {
    return `<details class="table-view"><summary>Ver dados em tabela</summary>
      <table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead>

  function statsView() {
    const data = seriesData();
    const s = state.stats;
    const activeDays = data.done.filter((d) => d.value > 0).length;
    const week = data.weeks[data.weeks.length - 1];
    const attrs = Object.entries(G.ATTRIBUTES).map(([id, a]) => ({ id, a, xp: state.hero.attrs[id], level: G.levelFromXp(state.hero.attrs[id], G.ATTR_BASE) }));

    return `

        <div class="stat card"><span class="muted small">Dias ativos (30 dias)</span><span class="stat-value">${activeDays}</span></div>
        <div class="stat card"><span class="muted small">Diárias nesta semana</span><span class="stat-value">${week && week.value != null ? `${week.value}%` : '—'}</span></div>
        <div class="stat card"><span class="muted small">Chefes derrotados</span><span class="stat-value">${s.bossesDefeated}</span></div>

      <div class="chart-card card">

        ${dataTable(['Dia', 'XP'], data.xp.map((d) => [d.label, d.value]))}
      </div>

      <div class="chart-card card">

      <div class="chart-card card">
        <h2>Atributos</h2>
        <p class="muted small">XP acumulado em cada atributo</p>
        <ul class="hbars">
          ${attrs.map((x) => `<li>
            <span class="hbar-label">${x.a.icon} ${x.a.name}</span>
            <span class="hbar-track"><span class="hbar-fill" style="width:${pct(x.xp, maxAttr)}%"></span></span>
            <span class="hbar-value">Nv. ${x.level} · ${C.compact(x.xp)} XP</span>
          </li>`).join('')}
        </ul>
      </div>
